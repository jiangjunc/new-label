<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label-新标签页</title>
    <link rel="stylesheet" href="./index.css">
    <script src="./win-manager.js"></script>
    <script src="./desktop-manager.js"></script>
</head>
<body>
    <div id="taskbar">
        <p id="time">0月0日 00:00</p>
        <div id="menuicon-box">
            <img id="setup-icon" src="./img/setup-icon.svg">
        </div>
    </div>
    <div id="dockapp-box"></div>
    <div id="start-menu-box">
        <div id="search-div">
            <div id="engine-img-div">
                <img src="./img/engine.svg" id="engine-img">
            </div>
            <input type="search" id="search-input" placeholder="搜索" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
            <img src="./img/search.svg" id="search-img">
        </div>
        <div id="manyuse-app-title">常用应用<div id="allAppList-title">全部应用 ></div></div>
        <div id="manyuse-app-box"></div>
    </div>
</body>
</html>
