<head>
    <link rel="stylesheet" href="./native-app/folder-app/folder-app.css">
    <script src="./native-app/folder-app/folder-app.js"></script>
</head>

<body>
    <div id="label-region">
        <div id="label-text-div">
            <img id="label-logo-icon" src="./img/appicon/folder-icon.svg">
            <p id="label-text">文件资源管理器</p>
        </div>
    </div>
    <div id="Address-box">
        <div id="Address-control-div">
            <img id="Address-arrow-back-icon" src="./img/arrow-back.svg">
            <img id="Address-arrow-forward-icon" src="./img/arrow-forward.svg">
            <img id="Address-arrow-up-icon" src="./img/arrow-up.svg">
        </div>
        <div id="Address-route-div">
            <p id="Address-route-text">用户名称 > 本地文件</p>
            <img id="Address-refresh-icon" src="./img/refresh.svg">
        </div>
        <div id="Address-search-div">
            <img id="Address-search-icon" src="./img/search.svg">
            <input type="text" id="Address-search-input" placeholder="在 本地文件 中搜索">
        </div>
    </div>
    <div id="FunctionBar">
        <div id="newbuiltBtn-box">
            <img id="newbuiltBtn-icon" src="./img/newbuilt-icon.svg">
            <p>新建</p>
        </div>
        <div id="functionBtn-box">
            <img id="functionBtn-upload-icon" src="./img/upload-icon.svg" class="functionBtn-icon">
            <img id="functionBtn-rename-icon" src="./img/rename-icon.svg" class="functionBtn-icon">
            <img id="functionBtn-share-icon" src="./img/share-icon.svg" class="functionBtn-icon">
            <img id="functionBtn-delete-icon" src="./img/delete-icon.svg" class="functionBtn-icon">
        </div>
        <div id="detailedInformationBtn-box">
            <img id="detailedInformationBtn-icon" src="./img/information-icon.svg" class="functionBtn-icon">
            <p>详细信息</p>
        </div>
    </div>
    <div id="NavigationPane">
        <div class="NavigationRegion-box">
            <div id="homeFolder-box" class="NavigationLabel-box">
                <img id="homeFolder-icon" src="./img/shouye.svg" class="NavigationRegion-icon">
                <p class="NavigationRegion-text">主文件夹</p>
            </div>
            <div id="transmission-box" class="NavigationLabel-box">
                <img id="transmission-icon" src="./img/transmission.svg" class="NavigationRegion-icon"
                    style="margin-top: 2px;">
                <p class="NavigationRegion-text">下载与传输</p>
            </div>
        </div>
        <div class="NavigationRegion-box">
            <div id="desktop-box" class="NavigationLabel-box">
                <img id="desktop-icon" src="./img/desktop.svg" class="NavigationRegion-icon">
                <p class="NavigationRegion-text">桌面</p>
            </div>
            <div id="picture-box" class="NavigationLabel-box">
                <img id="picture-icon" src="./img/picture.svg" class="NavigationRegion-icon" style="margin-top: 2px;">
                <p class="NavigationRegion-text">图片</p>
            </div>
            <div id="code-box" class="NavigationLabel-box">
                <img id="code-icon" src="./img/code.svg" class="NavigationRegion-icon" style="margin-top: 3px;">
                <p class="NavigationRegion-text">代码</p>
            </div>
            <div id="file-box" class="NavigationLabel-box">
                <img id="file-icon" src="./img/file.svg" class="NavigationRegion-icon">
                <p class="NavigationRegion-text">文件</p>
            </div>
        </div>
        <div id="PersonalCard-box">
            <img src="./img/ExampleAvatar.png">
            <b>待登陆</b>
        </div>
    </div>
    <div id="mainArea">
        <div id="homeFolderPage-box">
            <div id="storageCard">
                <p>网盘存储空间</p>
                <p>已用空间: 00.00MB/00.00MB</p>
                <p>个人已用空间: 00.00MB</p>
                <progress value="50" max="100"></progress>
            </div>
            <div id="quickAccess-box">
                <div id="quickAccessFile-desktop-box" class="quickAccessFile-div">
                    <img src="./img/folder-icon.svg">
                    <p>桌面</p>
                </div>
                <div id="quickAccessFile-picture-box" class="quickAccessFile-div">
                    <img src="./img/folder-icon.svg">
                    <p>图片</p>
                </div>
                <div id="quickAccessFile-code-box" class="quickAccessFile-div">
                    <img src="./img/folder-icon.svg">
                    <p>代码</p>
                </div>
                <div id="quickAccessFile-file-box" class="quickAccessFile-div">
                    <img src="./img/folder-icon.svg">
                    <p>文件</p>
                </div>
            </div>
        </div>
    </div>
    <div id="folderPage-div">
        <div id="quickAccessFile-desktop-box" class="quickAccessFile-div">
            <img src="./img/folder-icon.svg">
            <p>桌面</p>
        </div>
        <div id="quickAccessFile-picture-box" class="quickAccessFile-div">
            <img src="./img/folder-icon.svg">
            <p>图片</p>
        </div>
        <div id="quickAccessFile-code-box" class="quickAccessFile-div">
            <img src="./img/folder-icon.svg">
            <p>代码</p>
        </div>
        <div id="quickAccessFile-file-box" class="quickAccessFile-div">
            <img src="./img/folder-icon.svg">
            <p>文件</p>
        </div>
    </div>
</body>
