<style>
    body {
        margin: 0;
        padding: 0;
    }
    p {
        font-family: 'HarmonyOS', sans-serif;
    }
    #label-region {
        width: 100%;
        height: 36px;
        background-color: #e6e5ea;
    }
    #label-text-div {
        width: auto;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 10px;
    }
    #label-logo-icon {
        width: 26px;
        height: auto;
    }
    #Address-box {
        width: 100%;
        height: 40px;
        background-color: #ffffff;
        border-bottom: 2px solid #f7f7f7;
        display: flex;
        align-items: center;
    }
    #Address-control-div {
        width: 85px;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: 15px;
    }
    #Address-control-div img {
        width: 20px;
        height: auto;
    }
    #Address-route-div {
        width: 72%;
        height: 78%;
        background-color: #f3f3f3;
        border-radius: 5px;
        display: flex;
        align-items: center;
        margin-left: 20px;
    }
    #Address-route-text {
        margin-left: 15px;
    }
    #Address-refresh-icon {
        width: 18px;
        height: auto;
        margin-left: auto;
        margin-right: 10px;
    }
    #Address-search-div {
        width: 20%;
        height: 78%;
        background-color: #f3f3f3;
        border-radius: 5px;
        display: flex;
        align-items: center;
        margin-left: auto;
        margin-right: 20px;
    }
    #Address-search-icon {
        width: 16px;
        height: auto;
        margin-left: 12px;
    }
    #Address-search-input {
        background: none;
        border: none;
        outline: none;
        margin-left: 8px;
    }
</style>

<body>
    <div id="label-region">
        <div id="label-text-div">
            <img id="label-logo-icon" src="./img/folder-icon.svg">
            <p id="label-text">文件资源管理器</p>
        </div>
    </div>
    <div id="Address-box">
        <div id="Address-control-div">
            <img id="Address-arrow-back-icon" src="./img/arrow-back.svg">
            <img id="Address-arrow-forward-icon" src="./img/arrow-forward.svg">
            <img id="Address-arrow-up-icon" src="./img/arrow-up.svg">
        </div>
        <div id="Address-route-div">
            <p id="Address-route-text">用户名称 > 本地文件</p>
            <img id="Address-refresh-icon" src="./img/refresh.svg">
        </div>
        <div id="Address-search-div">
            <img id="Address-search-icon" src="./img/search.svg">
            <input type="text" id="Address-search-input" placeholder="在 本地文件 中搜索">
        </div>
    </div>
</body>
